<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>Battle Score — 陀螺盤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,"Noto Sans TC",sans-serif;touch-action:manipulation}
button{font:inherit}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#roomGate{position:absolute;inset:0;z-index:100;background:#090c12;display:flex;align-items:center;justify-content:center;padding:24px}
.gate{width:min(430px,92vw);background:#151a23;border:1px solid #3b4659;border-radius:18px;padding:24px;box-shadow:0 20px 70px #000}
.gate h1{margin:0 0 8px;font-size:28px}.gate p{color:#aeb7c8;line-height:1.6}.gate input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #4a566a;background:#252d3b;color:#fff;text-transform:uppercase;outline:none}.gate button{width:100%;margin-top:12px;padding:13px;border:1px solid #66758e;border-radius:10px;background:#252d3b;color:#fff;font-weight:800}.gate button.primary{background:#fff;color:#10131a}
#roomStatus{margin-top:10px;font-size:13px;color:#aeb7c8;min-height:18px}
#gyroStage{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}
#gyroStage.connected{display:flex}
#gyroCircle{position:relative;width:min(92dvh,92vw);height:min(92dvh,92vw);max-width:100vw;max-height:100dvh;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 3px #c9c9c9,0 0 0 7px #5a5a5a,0 0 35px #ffffff18,inset 0 0 50px #000;transform:scale(1);transition:width .18s,height .18s,transform .3s}
.half{position:absolute;top:0;width:50%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:background .35s,filter .35s,opacity .35s}
.half.blue{left:0;background:var(--blue,#1677ff)}.half.red{right:0;background:var(--red,#ef3048)}
.half::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff2,transparent 35%,#0003 78%);mix-blend-mode:screen;pointer-events:none}
.half.ready-on{background:#39ff72!important;animation:readyPulse 1.35s ease-in-out infinite}.both-ready .half.ready-on{animation:readyLaunch 1.2s ease-in-out 1 forwards}@keyframes readyLaunch{0%{filter:brightness(1.2)}35%{filter:brightness(1.65)}100%{filter:brightness(.12);opacity:.2}}
.half.ready-on .score,.half.ready-on .mistakes{opacity:0;transform:scale(.72)}
@keyframes readyPulse{0%,100%{filter:brightness(.78)}50%{filter:brightness(1.45)}}
.score{position:relative;z-index:2;font-family:Arial,"Noto Sans TC",sans-serif;font-weight:1000;font-size:clamp(70px,24vmin,300px);line-height:.8;letter-spacing:-.04em;text-shadow:0 6px 0 #0005,0 0 18px #fff2;transition:opacity .2s,transform .25s;user-select:none}
.mistakes{position:absolute;z-index:3;left:50%;bottom:16%;transform:translateX(-50%);display:flex;gap:clamp(5px,.7vmin,10px);transition:opacity .2s,transform .25s}
.mistake-dot{width:clamp(9px,1.45vmin,18px);height:clamp(9px,1.45vmin,18px);border:2px solid #ffffff80;background:#0004;border-radius:2px;box-shadow:inset 0 0 5px #0008}.mistake-dot.yellow{background:#ffd54a;border-color:#ffd54a;box-shadow:0 0 8px #ffd54a}.mistake-dot.red{background:#ff394f;border-color:#ff394f;box-shadow:0 0 8px #ff394f}
#divider{position:absolute;z-index:6;left:50%;top:50%;width:4px;height:72%;transform:translate(-50%,-50%);background:linear-gradient(#fff0,#d8d8d8 18%,#fff 50%,#777 82%,#fff0);opacity:.55;box-shadow:0 0 12px #fff6;pointer-events:none}
#vs{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);font-family:Impact,"Arial Black",sans-serif;font-size:clamp(42px,7vmin,92px);font-weight:1000;font-style:italic;letter-spacing:-5px;color:transparent;background:linear-gradient(180deg,#fff 0%,#d9d9d9 28%,#777 46%,#fff 55%,#555 72%,#eee 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px #fff;text-shadow:2px 3px 0 #111,0 0 14px #fff8;animation:vsSpin 3.2s ease-in-out infinite;transition:opacity .2s,transform .35s}
@keyframes vsSpin{0%,100%{transform:translate(-50%,-50%) rotate(-8deg) rotateY(0deg)}50%{transform:translate(-50%,-50%) rotate(8deg) rotateY(180deg)}}
.ready-on~#vs,.ready-state #vs{opacity:0}
#topControls{position:absolute;z-index:40;top:14px;right:14px;display:flex;gap:8px}
.top-btn{border:1px solid #ffffff55;background:#111c;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;backdrop-filter:blur(8px);cursor:pointer}.top-btn:active{transform:scale(.96)}
#exitRoomBtn{display:none}
#signal{position:fixed;inset:0;z-index:80;background:#000;display:none;align-items:center;justify-content:center;pointer-events:none}
#signal.show{display:flex}.signal-word{font-size:clamp(110px,31vw,560px);line-height:.88;font-weight:1000;letter-spacing:clamp(2px,.8vw,12px);white-space:nowrap;color:#fff;text-shadow:0 8px 0 #0008,0 0 28px #fff}.signal-word.n{color:#f32b2b;text-shadow:0 0 24px #ff4545,0 8px 0 #000}.signal-word.go{color:#39ff72;text-shadow:0 0 22px #8dffac,0 7px 0 #000}.signal-word.shoot{color:#ffd21f;text-shadow:0 0 24px #ffae00,0 8px 0 #000}.signal-word.sm{font-size:clamp(92px,26vw,465px)}
#winLayer{position:fixed;inset:0;z-index:70;background:#000;display:none;align-items:center;justify-content:center;pointer-events:none}.win-circle{position:absolute;width:min(92dvh,92vw);height:min(92dvh,92vw);border-radius:50%;overflow:hidden;transform:scale(.15);opacity:0;box-shadow:0 0 0 3px #aaa,0 0 30px #fff3}.win-circle.show{animation:winCircle 1.15s cubic-bezier(.2,.85,.3,1) forwards}.win-half{position:absolute;top:0;width:50%;height:100%;display:flex;align-items:center;justify-content:center}.win-half.blue{left:0}.win-half.red{right:0}.win-half .win-score{font-size:clamp(70px,24vmin,300px);font-weight:1000;text-shadow:0 6px 0 #0005}.win-half.loser{background:#000!important}.win-half.loser .win-score{font-size:clamp(55px,18vmin,220px)}
@keyframes winCircle{0%{transform:scale(.15);opacity:0}25%{transform:scale(1.08);opacity:1}55%{transform:scale(1);opacity:1}100%{transform:scale(.72);opacity:1}}
#winCenter{position:absolute;z-index:3;display:none;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(55px,12vmin,160px);font-style:italic;color:#ffe06a;text-shadow:0 4px 0 #5b3900,0 0 24px #ffd54a;transform:scale(.2);opacity:0}.win-active #winCenter{display:block;animation:winCenter .65s .75s cubic-bezier(.34,1.56,.64,1) forwards}@keyframes winCenter{to{transform:scale(1);opacity:1}}
#connectionDot{position:absolute;left:14px;top:16px;z-index:41;width:9px;height:9px;border-radius:50%;background:#39ff72;box-shadow:0 0 10px #39ff72}.offline #connectionDot{background:#ff394f;box-shadow:0 0 10px #ff394f}
@media(max-height:520px){#gyroCircle{width:min(88dvh,92vw);height:min(88dvh,92vw)}.score{font-size:clamp(55px,24vmin,230px)}.top-btn{padding:6px 9px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="roomGate">
    <div class="gate">
      <h1>陀螺盤</h1>
      <p>輸入主審的房間碼後，這台裝置會同步顯示比賽狀態。</p>
      <input id="roomInput" maxlength="8" placeholder="輸入房間碼" autocomplete="off">
      <button class="primary" id="joinBtn">加入陀螺盤</button>
      <button id="backBtn">退出房間</button>
      <div id="roomStatus">尚未連線</div>
    </div>
  </div>
  <div id="gyroStage">
    <div id="connectionDot"></div>
    <div id="topControls"><button class="top-btn" id="fullscreenBtn">⛶ 全螢幕</button></div>
    <div id="gyroCircle">
      <div class="half blue" id="blueHalf"><div class="score" id="blueScore">0</div><div class="mistakes" id="blueMistakes"></div></div>
      <div class="half red" id="redHalf"><div class="score" id="redScore">0</div><div class="mistakes" id="redMistakes"></div></div>
      <div id="divider"></div><div id="vs">VS</div>
    </div>
  </div>
  <div id="signal"><div class="signal-word" id="signalWord"></div></div>
  <div id="winLayer"><div class="win-circle" id="winCircle"><div class="win-half blue" id="winBlue"><div class="win-score" id="winBlueScore">0</div></div><div class="win-half red" id="winRed"><div class="win-score" id="winRedScore">0</div></div></div><div id="winCenter">WIN</div></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);let peer=null,conn=null,room='',state={blue:0,red:0,blueReady:false,redReady:false,blueColor:'#1677ff',redColor:'#ef3048',mistakeCount:{blue:0,red:0},mistakeLimit:3,winner:null,gameOver:false,round:0};let signalTimer=null;
function status(t){$('roomStatus').textContent=t}
function applyState(s){if(!s)return;state=Object.assign(state,s);render()}
function renderMistakes(team){const box=$(team+'Mistakes');box.innerHTML='';const lim=Math.max(0,Math.min(99,Number(state.mistakeLimit)||0));const cnt=Math.max(0,Number(state.mistakeCount?.[team])||0);for(let i=0;i<lim;i++){const d=document.createElement('i');d.className='mistake-dot';if(i<cnt)d.classList.add(i>=Math.max(0,lim-2)?'red':'yellow');box.appendChild(d)}box.style.display=lim?'flex':'none'}
function render(){const bc=state.blueColor||'#1677ff',rc=state.redColor||'#ef3048';$('blueHalf').style.setProperty('--blue',bc);$('redHalf').style.setProperty('--red',rc);$('blueHalf').style.background=bc;$('redHalf').style.background=rc;$('blueScore').textContent=state.blue??0;$('redScore').textContent=state.red??0;renderMistakes('blue');renderMistakes('red');const b=!!state.blueReady,r=!!state.redReady;document.body.classList.toggle('both-ready',b&&r);$('blueHalf').classList.toggle('ready-on',b);$('redHalf').classList.toggle('ready-on',r);$('vs').style.opacity=(b||r)?'0':'1';if(state.gameOver&&state.winner)showWin();else hideWin()}
function showSignal(word,opt={}){clearTimeout(signalTimer);const el=$('signal'),w=$('signalWord');if(!['READY','3','2','1','GO','SHOOT'].includes(word))return;w.textContent=word;w.className='signal-word '+(word==='SHOOT'?'shoot':word==='GO'?'go':/^[321]$/.test(word)?'n':'')+((word==='READY'||word==='SHOOT')?' sm':'');el.classList.add('show');const dur=Number(opt.dur)||({READY:2000,'3':700,'2':700,'1':700,GO:1000,SHOOT:3000}[word]||700);signalTimer=setTimeout(()=>hideSignal(),dur+150)}
function hideSignal(){clearTimeout(signalTimer);$('signal').classList.remove('show');$('signalWord').textContent=''}
function showWin(){hideSignal();$('winLayer').style.display='flex';$('winCircle').classList.remove('show');void $('winCircle').offsetWidth;$('winCircle').classList.add('show');const w=state.winner;const bc=state.blueColor||'#1677ff',rc=state.redColor||'#ef3048';$('winBlue').style.background= w==='blue'?bc:'#000';$('winRed').style.background=w==='red'?rc:'#000';$('winBlueScore').textContent=state.blue??0;$('winRedScore').textContent=state.red??0;document.body.classList.add('win-active')}
function hideWin(){document.body.classList.remove('win-active');$('winLayer').style.display='none'}
function leave(){try{conn?.close()}catch(e){}try{peer?.destroy()}catch(e){}conn=null;peer=null;document.body.classList.add('offline');$('gyroStage').classList.remove('connected');$('roomGate').style.display='flex';status('已離開房間')}
function join(code){code=String(code||'').trim().toUpperCase();if(!code){status('請輸入房間碼');return}try{peer?.destroy()}catch(e){}room=code;peer=new Peer();document.body.classList.remove('offline');status('連線中…');peer.on('open',()=>{conn=peer.connect('bs-'+room,{reliable:true});conn.on('open',()=>{conn.send({type:'hello',role:'gyro'});conn.send({type:'stateRequest'});status('已加入陀螺盤：'+room);$('roomGate').style.display='none';$('gyroStage').classList.add('connected');render()});conn.on('data',msg=>{if(msg.type==='state')applyState(msg.state);else if(msg.type==='signal')showSignal(msg.word,msg);else if(msg.type==='signalEnd')hideSignal();else if(msg.type==='roomClosed'){status('主控已關閉房間');leave()} });conn.on('close',()=>{status('房間連線已中斷');document.body.classList.add('offline')});conn.on('error',e=>status('同步錯誤：'+e.message))});peer.on('error',e=>status('加入失敗：'+e.message))}
$('joinBtn').onclick=()=>join($('roomInput').value);$('roomInput').addEventListener('keydown',e=>{if(e.key==='Enter')join($('roomInput').value)});$('backBtn').onclick=()=>{const back=new URLSearchParams(location.search).get('back');if(back)location.href=back;else history.back()};$('fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen({navigationUI:'hide'});$('fullscreenBtn').textContent='⛶ 退出全螢幕'}else{await document.exitFullscreen();$('fullscreenBtn').textContent='⛶ 全螢幕'}}catch(e){$('fullscreenBtn').textContent='⛶ 全螢幕'}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('fullscreenBtn').textContent='⛶ 全螢幕'});
$('blueHalf').addEventListener('pointerdown',()=>{if(conn?.open)conn.send({type:'readyToggle',team:'blue'})});$('redHalf').addEventListener('pointerdown',()=>{if(conn?.open)conn.send({type:'readyToggle',team:'red'})});
const q=new URLSearchParams(location.search);if(q.get('room'))join(q.get('room'));else document.body.classList.add('offline');
})();
</script>
</body></html>
