<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Competition Player Manager — 現場報名</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 12% 0%,#1c2941 0,#0b0f16 38%);color:#eef3f8;min-height:100vh}
button,input,textarea{font:inherit}
.app{max-width:1320px;margin:auto;padding:30px 24px 48px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1{margin:0 0 6px;font-size:32px;letter-spacing:-.03em}
.sub{color:#91a0b3;margin:0}
.eyebrow{color:#77a9ff;font-size:12px;font-weight:700;letter-spacing:.15em;margin-bottom:8px}
.nav{display:flex;gap:8px;background:#101827;border:1px solid #26364d;border-radius:14px;padding:5px;margin-bottom:20px}
.nav button{background:transparent;color:#91a0b3;padding:10px 16px}
.nav button.active{background:#2d6cdf;color:#fff;box-shadow:0 5px 16px #2d6cdf55}
.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}
.card{background:linear-gradient(145deg,#151f30,#101722);border:1px solid #2a3a52;border-radius:20px;padding:22px;box-shadow:0 18px 45px #0006}
label{display:block;font-size:13px;color:#aab6c5;margin:12px 0 6px}
input,textarea,select{width:100%;background:#0b111b;color:#fff;border:1px solid #344256;border-radius:10px;padding:11px 12px;outline:none}
select{appearance:auto}
option{background:#0b111b;color:#fff}
input:focus,textarea:focus{border-color:#6ea8ff}
textarea{min-height:78px;resize:vertical}
.row{display:flex;gap:9px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 14px;background:#2d6cdf;color:white;cursor:pointer;transition:.18s ease}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.secondary{background:#202b3b}
button.danger{background:#a93d4b}
button.small{padding:7px 10px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:16px}
.preview{width:92px;height:92px;border-radius:14px;border:1px dashed #4b5a70;display:grid;place-items:center;overflow:hidden;background:#0b111b;margin-top:8px;color:#77869a}
.preview img{width:100%;height:100%;object-fit:cover}
.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:#0d141f;border:1px solid #253246;border-radius:14px;padding:12px 16px;min-width:120px}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:#8e9daf}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:180px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #253044;vertical-align:middle}
th{color:#93a1b4;font-size:12px}
.avatar{width:42px;height:42px;border-radius:9px;object-fit:cover;background:#263244}
.noavatar{display:grid;place-items:center;color:#77869a}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1b2d45;color:#9fc4ff;font-size:12px}
.empty{text-align:center;padding:45px;color:#77869a}
.note{font-size:12px;line-height:1.6;color:#8190a3;margin-top:12px}
.hidden{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:#e9f1ff;color:#0b111b;padding:11px 15px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.bracket-card{overflow:hidden}
.bracket-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bracket-info{color:#91a0b3;font-size:13px;margin:8px 0 14px}
.bracket-wrap{overflow:auto;padding-bottom:8px}
.bracket{display:flex;gap:22px;min-width:max-content;align-items:stretch;padding:10px 2px 18px}
.round{width:205px;display:flex;flex-direction:column;gap:12px}
.round h3{font-size:13px;color:#9fc4ff;margin:0 0 3px}
.matches{display:flex;flex-direction:column;justify-content:space-around;gap:12px;flex:1}
.match{background:#0d141f;border:1px solid #29384d;border-radius:12px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;min-height:88px;border-right:1px solid #253044;font-size:13px;text-align:center}
.slot:last-child{border-right:0}
.slot.winner{color:#fff;font-weight:700}
.slot.eliminated{opacity:.38;filter:grayscale(.8)}
.slot.eliminated .player-photo{border-color:#455066}
.slot.eliminated .player-name::after{content:" · 淘汰";font-size:10px;color:#8490a3}
.slot.bye{color:#8e9daf;font-style:italic}
.slot.placeholder{min-height:54px;color:transparent}
.player-photo{width:42px;height:42px;flex:0 0 42px;border:2px solid #344761;border-radius:50%;padding:0;overflow:hidden;background:#1d2b40;color:#a9c5ee;display:grid;place-items:center;touch-action:none;user-select:none}
.player-photo img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.player-photo span{font-size:13px;font-weight:700;pointer-events:none}
.player-photo:active{border-color:#ffd166;box-shadow:0 0 0 4px #ffd16633}
.player-name{width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.champion{margin:16px auto 0;color:#ffd166;font-weight:700;display:flex;align-items:center;gap:9px;background:#3a2e12;border:1px solid #806522;border-radius:14px;padding:9px 13px}
.champion .player-photo{border-color:#ffd166}
.form-card{display:none}
.modal-open .form-card{display:block;position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 28px));max-height:90vh;overflow:auto}
.modal-backdrop{display:none;position:fixed;inset:0;background:#02050bcc;backdrop-filter:blur(5px);z-index:20}
.modal-open .modal-backdrop{display:block}
.modal-close{float:right;background:#202b3b;padding:6px 10px}
.bracket.horizontal{flex-direction:row}
.bracket.vertical{flex-direction:column-reverse;align-items:center;min-width:0;width:100%;gap:18px}
.bracket.vertical .round{width:min(100%,520px)}
.bracket.vertical .matches{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px}
.bracket.vertical .match{width:205px}
.direction-note{font-size:12px;color:#8e9daf;background:#0d141f;border:1px solid #253246;border-radius:999px;padding:6px 10px}
.court-setting{display:flex;align-items:center;gap:6px;margin:0;color:#aab6c5;font-size:12px}
.court-setting input{width:64px;padding:7px 8px}
.court-style{width:auto;padding:7px 9px;font-size:12px}
.court-label{grid-column:1/-1;background:#263b5a;border:1px solid #45658f;border-radius:7px;color:#c9dcff;text-align:center;font-size:12px;font-weight:700;padding:5px 8px;letter-spacing:.05em}
@media(max-width:850px){.grid{grid-template-columns:1fr}.app{padding:20px 14px 40px}.topbar{display:block}.topbar .primary{margin-top:16px}.bracket.horizontal{gap:12px}.round{width:180px}}
@media(max-width:600px){
  body{overflow-x:hidden;background:linear-gradient(180deg,#101a2a 0,#0b0f16 38%);-webkit-tap-highlight-color:transparent}
  .app{width:100%;padding:18px 12px calc(32px + env(safe-area-inset-bottom))}
  .topbar{margin-bottom:16px}.eyebrow{font-size:10px}.topbar h1{font-size:24px}.sub{font-size:12px;line-height:1.5}
  .topbar .primary{width:100%;margin-top:14px;padding:12px}
  .nav{position:sticky;top:8px;z-index:10;margin:0 -2px 14px;padding:4px;border-radius:13px;box-shadow:0 8px 24px #0005}
  .nav button{flex:1;padding:11px 8px;font-size:14px}
  .card{border-radius:16px;padding:15px;box-shadow:0 12px 28px #0006}
  .stats{gap:8px;margin-bottom:12px}.stat{flex:1;min-width:0;padding:10px 11px}.stat b{font-size:18px}.stat span{font-size:11px}
  .toolbar{gap:7px}.toolbar .search{flex-basis:100%;min-width:0}.toolbar button{flex:1;padding:9px 6px;font-size:12px}
  .tablewrap{margin:0 -5px}.tablewrap table{min-width:650px}
  .bracket-toolbar{align-items:stretch}.bracket-toolbar h2{font-size:20px;flex-basis:100%}
  .direction-note{font-size:11px;align-self:center}.bracket-toolbar button{padding:9px 8px;font-size:12px}
  .court-setting{flex:1}.court-style{flex:1;min-width:0}
  .bracket-info{font-size:12px;line-height:1.5;margin:10px 0}
  .bracket-wrap{margin:0 -5px;padding:4px 5px 14px}
  .bracket.vertical{gap:14px}.bracket.vertical .round{width:100%}.bracket.vertical .matches{gap:8px}
  .bracket.vertical .match{width:calc(50% - 4px);min-width:0;padding:6px}.slot{min-height:82px}.player-photo{width:44px;height:44px;flex-basis:44px}
  .player-name{font-size:11px}.bracket.horizontal{gap:10px}.bracket.horizontal .round{width:170px}.bracket.horizontal .match{padding:6px}
  .modal-open .form-card{width:calc(100vw - 24px);max-height:calc(100vh - 28px);padding:18px}
  input,textarea,select{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><div class="eyebrow">COMPETITION CONTROL</div><h1>選手與淘汰賽管理</h1><div class="sub">集中管理報名資料，清楚掌握每一場晉級結果。</div></div>
    <button class="primary" id="openFormBtn">＋ 新增選手</button>
  </div>
  <div class="nav" role="tablist">
    <button class="active" data-view="playersView">選手名單</button>
    <button data-view="bracketView">淘汰賽對戰</button>
  </div>

  <section id="playersView" class="view active">
    <div class="grid">
    <section class="card form-card">
      <button class="modal-close" id="closeFormBtn" type="button">×</button>
      <h2 id="formTitle">新增選手</h2>
      <label>姓名 *</label>
      <input id="name" placeholder="例如：王小明">
      <label>國籍</label>
      <select id="nationality">
        <option value="">選擇國籍</option>
        <option value="🇹🇼 台灣">🇹🇼 台灣</option>
        <option value="🇯🇵 日本">🇯🇵 日本</option>
        <option value="🇰🇷 韓國">🇰🇷 韓國</option>
        <option value="🇺🇸 美國">🇺🇸 美國</option>
        <option value="🇨🇦 加拿大">🇨🇦 加拿大</option>
        <option value="🇬🇧 英國">🇬🇧 英國</option>
        <option value="🇫🇷 法國">🇫🇷 法國</option>
        <option value="🇩🇪 德國">🇩🇪 德國</option>
        <option value="🇮🇹 義大利">🇮🇹 義大利</option>
        <option value="🇪🇸 西班牙">🇪🇸 西班牙</option>
        <option value="🇦🇺 澳洲">🇦🇺 澳洲</option>
        <option value="🇳🇿 紐西蘭">🇳🇿 紐西蘭</option>
        <option value="🇸🇬 新加坡">🇸🇬 新加坡</option>
        <option value="🇲🇾 馬來西亞">🇲🇾 馬來西亞</option>
        <option value="🇹🇭 泰國">🇹🇭 泰國</option>
        <option value="🇻🇳 越南">🇻🇳 越南</option>
        <option value="🇵🇭 菲律賓">🇵🇭 菲律賓</option>
        <option value="🇮🇩 印尼">🇮🇩 印尼</option>
        <option value="🇮🇳 印度">🇮🇳 印度</option>
        <option value="🇨🇳 中國">🇨🇳 中國</option>
        <option value="🇭🇰 香港">🇭🇰 香港</option>
        <option value="🇲🇴 澳門">🇲🇴 澳門</option>
        <option value="other">🌐 其他國家／地區</option>
      </select>
      <input id="nationalityOther" class="hidden" placeholder="輸入其他國家／地區">
      <label>暱稱</label>
      <input id="nickname" placeholder="例如：Ming">
      <label>選手照片</label>
      <input id="photo" type="file" accept="image/*">
      <div class="preview" id="preview">照片預覽</div>
      <label>簡介／備註</label>
      <textarea id="bio" placeholder="可填寫選手簡介、作品、隊伍等"></textarea>

      <div class="actions">
        <button id="saveBtn">新增選手</button>
        <button class="secondary" id="cancelBtn" style="display:none">取消編輯</button>
      </div>
      <div class="note">
        選手編號由系統自動產生，例如 P0001、P0002。<br>
        不讓報名者自己輸入編號，避免重複。
      </div>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><b id="count">0</b><span>目前選手</span></div>
        <div class="stat"><b id="selected">—</b><span>目前選取</span></div>
      </div>

      <div class="toolbar">
        <input class="search" id="search" placeholder="搜尋姓名／暱稱／編號">
        <button class="secondary" id="exportBtn">匯出完整備份</button>
        <button class="secondary" id="importBtn">匯入完整備份</button>
        <input id="importFile" class="hidden" type="file" accept=".json,application/json">
        <button class="danger" id="clearBtn">清空資料</button>
      </div>

      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>照片</th><th>編號</th><th>姓名</th><th>國籍</th><th>暱稱</th><th>操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty">還沒有選手，從左側新增第一位。</div>
      </div>
    </section>
  </div>
  </section>

  <section id="bracketView" class="view">
  <section class="card bracket-card">
    <div class="bracket-toolbar">
      <h2 style="margin:0;flex:1">隨機淘汰賽</h2>
      <span class="direction-note" id="directionNote">等待抽籤</span>
      <label class="court-setting">賽場 <input id="courtCount" type="number" min="1" max="99" value="3" inputmode="numeric"></label>
      <select id="courtStyle" class="court-style" aria-label="賽場編號格式"><option value="number">1-1、2-1</option><option value="round-number">01-1、02-1</option><option value="letter-number">A-1、B-1</option></select>
      <button id="drawBtn">隨機抽籤產生對戰</button>
      <button class="secondary" id="clearBracketBtn">清除對戰表</button>
    </div>
    <div class="bracket-info" id="bracketInfo">請先新增選手，再按「隨機抽籤產生對戰」。</div>
    <div class="bracket-wrap"><div class="bracket" id="bracket"></div></div>
  </section>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop"></div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "competition_players_v1";
const DB_NAME = "competition_player_manager_db_v1";
const CHANNEL_NAME = "competition_players_channel_v1";
let players = [];
let bracket = null;
let editingId = null;
let photoData = "";
let channel = null;

try { channel = new BroadcastChannel(CHANNEL_NAME); } catch(e) {}

function openForm(){document.body.classList.add("modal-open");}
function closeForm(){document.body.classList.remove("modal-open");}
document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===btn));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===btn.dataset.view));
});
document.getElementById("openFormBtn").onclick=()=>{resetForm();openForm();};
document.getElementById("closeFormBtn").onclick=closeForm;
document.getElementById("modalBackdrop").onclick=closeForm;

function dbRequest(action){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return;}
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>request.result.createObjectStore("data");
    request.onerror=()=>reject(request.error||new Error("IndexedDB open failed"));
    request.onsuccess=()=>{
      const db=request.result;
      const tx=db.transaction("data",action.type==="get"?"readonly":"readwrite");
      const store=tx.objectStore("data");
      const req=action.type==="get"?store.get(action.key):store.put(action.value,action.key);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error("IndexedDB request failed"));
      tx.oncomplete=()=>db.close();
    };
  });
}
async function load(){
  try {
    const stored=await dbRequest({type:"get",key:"players"});
    bracket=await dbRequest({type:"get",key:"bracket"})||null;
    if(Array.isArray(stored)) players=stored;
    else {
      const data=JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      players=Array.isArray(data)?data:[];
      if(players.length) await dbRequest({type:"put",key:"players",value:players});
    }
  } catch(e) {
    try {
      const data=JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      players=Array.isArray(data)?data:[];
    } catch(err){ players=[]; }
  }
  render(); renderBracket();
}
async function saveAll(){
  const value=JSON.stringify(players);
  try {
    await dbRequest({type:"put",key:"players",value:players});
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) {
    try { localStorage.setItem(STORAGE_KEY,value); }
    catch(err) {
      console.error("選手資料儲存失敗",err);
      toast("儲存失敗：瀏覽器儲存空間不足");
      return false;
    }
  }
  try { channel && channel.postMessage({type:"players-updated",players}); } catch(e){}
  try { window.dispatchEvent(new StorageEvent("storage",{key:STORAGE_KEY,newValue:value})); } catch(e){}
  bracket=null;
  try { await dbRequest({type:"put",key:"bracket",value:null}); } catch(e){}
  renderBracket();
  return true;
}
async function saveBracket(){
  try { await dbRequest({type:"put",key:"bracket",value:bracket}); }
  catch(e){ toast("對戰表儲存失敗"); }
  renderBracket();
}
function nextNumber(){
  let max=0;
  players.forEach(p=>{
    const n=parseInt(String(p.registrationNo||"").replace(/\D/g,""),10);
    if(Number.isFinite(n)) max=Math.max(max,n);
  });
  return "P"+String(max+1).padStart(4,"0");
}
function uid(){
  return "pl_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=players.filter(p=>[p.registrationNo,p.name,p.nickname,p.nationality].join(" ").toLowerCase().includes(q));
  document.getElementById("count").textContent=players.length;
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  document.getElementById("empty").style.display=list.length?"none":"block";
  list.forEach(p=>{
    const tr=document.createElement("tr");
    const pic=p.photo
      ? `<img class="avatar" src="${p.photo}" alt="">`
      : `<div class="avatar noavatar">—</div>`;
    tr.innerHTML=`
      <td>${pic}</td>
      <td><span class="badge">${esc(p.registrationNo)}</span></td>
      <td>${esc(p.name)}</td>
      <td>${esc(p.nationality||"—")}</td>
      <td>${esc(p.nickname||"—")}</td>
      <td>
        <div class="row">
          <button class="small" onclick="selectPlayer('${p.id}')">選取</button>
          <button class="small secondary" onclick="editPlayer('${p.id}')">編輯</button>
          <button class="small danger" onclick="deletePlayer('${p.id}')">刪除</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}
function resetForm(){
  editingId=null; photoData="";
  document.getElementById("formTitle").textContent="新增選手";
  document.getElementById("saveBtn").textContent="新增選手";
  document.getElementById("cancelBtn").style.display="none";
  ["name","nationalityOther","nickname","bio"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("nationality").value="";
  document.getElementById("photo").value="";
  document.getElementById("preview").innerHTML="照片預覽";
}
function readForm(){
  const country=document.getElementById("nationality").value;
  return {
    name:document.getElementById("name").value.trim(),
    nationality:country==="other"
      ? document.getElementById("nationalityOther").value.trim()
      : country,
    nickname:document.getElementById("nickname").value.trim(),
    bio:document.getElementById("bio").value.trim(),
    photo:photoData
  };
}
document.getElementById("nationality").addEventListener("change",e=>{
  document.getElementById("nationalityOther").classList.toggle("hidden",e.target.value!=="other");
});
document.getElementById("photo").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1000, scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      photoData=canvas.toDataURL("image/jpeg",.78);
      document.getElementById("preview").innerHTML=`<img src="${photoData}" alt="照片預覽">`;
    };
    img.onerror=()=>{photoData="";toast("照片讀取失敗，請重新選擇圖片");};
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById("saveBtn").onclick=async()=>{
  const d=readForm();
  if(!d.name){toast("請先輸入姓名");return;}
  if(editingId){
    const p=players.find(x=>x.id===editingId);
    const old=p&&{...p};
    if(p) Object.assign(p,d,{updatedAt:new Date().toISOString()});
    if(!await saveAll()) { if(p&&old) Object.assign(p,old); return; }
    toast("選手資料已更新");
  }else{
    const p={
      id:uid(),
      registrationNo:nextNumber(),
      registrationOrder:players.length+1,
      seed:null,
      ...d,
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString()
    };
    players.push(p);
    if(!await saveAll()) { players.pop(); return; }
    toast(`已新增 ${p.registrationNo}`);
  }
  resetForm(); render(); closeForm();
};
document.getElementById("cancelBtn").onclick=()=>{resetForm();closeForm();};
document.getElementById("search").oninput=render;

window.selectPlayer=id=>{
  const p=players.find(x=>x.id===id); if(!p)return;
  const selected={...p};
  delete selected.photo;
  localStorage.setItem("competition_selected_player_v1",JSON.stringify(selected));
  try{channel&&channel.postMessage({type:"player-selected",player:p});}catch(e){}
  document.getElementById("selected").textContent=p.registrationNo;
  toast(`${p.registrationNo} ${p.name} 已選取，計分系統可以讀取`);
};
window.editPlayer=id=>{
  const p=players.find(x=>x.id===id); if(!p)return;
  openForm();
  editingId=id; photoData=p.photo||"";
  document.getElementById("formTitle").textContent="編輯選手";
  document.getElementById("saveBtn").textContent="儲存修改";
  document.getElementById("cancelBtn").style.display="inline-block";
  document.getElementById("name").value=p.name||"";
  const countryValues=[...document.getElementById("nationality").options].map(o=>o.value);
  if(countryValues.includes(p.nationality)){
    document.getElementById("nationality").value=p.nationality;
    document.getElementById("nationalityOther").value="";
    document.getElementById("nationalityOther").classList.add("hidden");
  }else{
    document.getElementById("nationality").value=p.nationality?"other":"";
    document.getElementById("nationalityOther").value=p.nationality||"";
    document.getElementById("nationalityOther").classList.toggle("hidden",!p.nationality);
  }
  document.getElementById("nickname").value=p.nickname||"";
  document.getElementById("bio").value=p.bio||"";
  document.getElementById("preview").innerHTML=p.photo?`<img src="${p.photo}">`:"照片預覽";
  scrollTo({top:0,behavior:"smooth"});
};
window.deletePlayer=async id=>{
  const p=players.find(x=>x.id===id); if(!p)return;
  if(!confirm(`確定刪除 ${p.registrationNo} ${p.name}？`))return;
  players=players.filter(x=>x.id!==id);
  if(await saveAll()){ render(); toast("已刪除"); }
};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),players,bracket},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="competition-players-backup.json";a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const data=JSON.parse(r.result);
      const incoming=Array.isArray(data)?data:data.players;
      if(!Array.isArray(incoming))throw Error();
      const importedBracket=data.bracket||null;
      players=incoming;
      if(await saveAll()){
        bracket=importedBracket;
        await saveBracket();
        render();toast(`已匯入 ${players.length} 位選手（含照片與對戰表）`);
      }
    }catch(err){alert("JSON 格式不正確");}
    e.target.value="";
  };
  r.readAsText(file);
};
document.getElementById("clearBtn").onclick=async()=>{
  if(!players.length)return;
  if(confirm("確定清空全部選手資料？此操作無法復原，建議先匯出 JSON。")){
    const old=players; players=[];
    if(await saveAll()){render();resetForm();toast("資料已清空");}
    else players=old;
  }
};
function playerLabel(id){
  const p=players.find(x=>x.id===id);
  return p?`${p.registrationNo} ${p.name}`:"等待上一場";
}
function getCourtConfig(){
  const count=Math.max(1,Math.min(99,parseInt(document.getElementById("courtCount")?.value,10)||3));
  const style=document.getElementById("courtStyle")?.value||"number";
  return {count,style};
}
function assignCourts(){
  if(!bracket)return;
  const config=bracket.courtConfig||getCourtConfig();
  let sequence=0;
  bracket.rounds.forEach(round=>round.forEach(match=>{
    match.courtNo=(sequence%config.count)+1;
    match.courtOrder=Math.floor(sequence/config.count)+1;
    sequence++;
  }));
}
function courtLabel(match){
  const config=bracket?.courtConfig||getCourtConfig();
  const court=match.courtNo||1, order=match.courtOrder||1;
  if(config.style==="round-number")return `${String(court).padStart(2,"0")}-${order}`;
  if(config.style==="letter-number")return `${String.fromCharCode(65+((court-1)%26))}-${order}`;
  return `${court}-${order}`;
}
function syncCourtControls(){
  const config=bracket?.courtConfig||getCourtConfig();
  const count=document.getElementById("courtCount"),style=document.getElementById("courtStyle");
  if(count)count.value=config.count;
  if(style)style.value=config.style;
}
function roundName(i,total){
  if(i===total-1)return "冠軍戰";
  if(i===total-2)return "準決賽";
  if(i===total-3)return "八強";
  return `第 ${i+1} 輪`;
}
function propagateWinner(r,i,id){
  if(r>=bracket.rounds.length-1)return;
  const nextIndex=Math.floor(i/2);
  const next=bracket.rounds[r+1][nextIndex];
  if(id){if(i%2===0)next.p1=id;else next.p2=id;}
  const left=bracket.rounds[r][nextIndex*2];
  const right=bracket.rounds[r][nextIndex*2+1];
  const leftDone=!!left.winner||!!left.bye||!!left.resolved;
  const rightDone=!!right.winner||!!right.bye||!!right.resolved;
  // 空場視為已完成；只有兩個前置對戰都結束後，唯一選手才自動往上。
  if(leftDone&&rightDone){
    if(next.p1&&!next.p2){next.winner=next.p1;next.resolved=true;propagateWinner(r+1,nextIndex,next.winner);}
    else if(next.p2&&!next.p1){next.winner=next.p2;next.resolved=true;propagateWinner(r+1,nextIndex,next.winner);}
    else if(!next.p1&&!next.p2){next.winner=null;next.resolved=true;propagateWinner(r+1,nextIndex);}
    else {next.winner=null;next.resolved=false;}
  }
}
function clearDownstream(r,i){
  if(r>=bracket.rounds.length-1)return;
  const next=bracket.rounds[r+1][Math.floor(i/2)];
  if(i%2===0)next.p1=null;else next.p2=null;
  next.winner=null;next.resolved=false;
  clearDownstream(r+1,Math.floor(i/2));
}
function removeWinnerFromNext(r,i,id){
  if(r>=bracket.rounds.length-1)return;
  const nextIndex=Math.floor(i/2), next=bracket.rounds[r+1][nextIndex];
  if(next.p1===id)next.p1=null;
  if(next.p2===id)next.p2=null;
  next.winner=null;next.resolved=false;
  clearDownstream(r+1,nextIndex);
}
function bindHold(button,action){
  let timer=null, fired=false;
  const start=e=>{e.preventDefault();fired=false;timer=setTimeout(()=>{fired=true;action();},1000);};
  const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}};
  button.addEventListener("pointerdown",start);
  ["pointerup","pointerleave","pointercancel"].forEach(x=>button.addEventListener(x,cancel));
  button.addEventListener("contextmenu",e=>e.preventDefault());
}
window.chooseWinner=async(r,i,id)=>{
  if(!bracket)return;
  const m=bracket.rounds[r][i];
  if(m.p1!==id&&m.p2!==id)return;
  if(m.winner===id){
    m.winner=null;
    removeWinnerFromNext(r,i,id);
    await saveBracket();
    toast(`${playerLabel(id)} 已返回上一戰`);
    return;
  }
  if(m.winner&&m.winner!==id){toast("請先長按目前勝者返回上一戰");return;}
  m.winner=id;
  m.resolved=true;
  propagateWinner(r,i,id);
  await saveBracket();
  toast(`${playerLabel(id)} 已晉級`);
};
function renderBracket(){
  const el=document.getElementById("bracket");
  const info=document.getElementById("bracketInfo");
  const direction=document.getElementById("directionNote");
  if(!el||!info)return;
  el.innerHTML="";
  syncCourtControls();
  const compact=players.length<=8;
  el.className=`bracket ${compact?"vertical":"horizontal"}`;
  assignCourts();
  if(direction)direction.textContent=compact?"少人：由下往上":"多人：左右往冠軍";
  if(!bracket){info.textContent=players.length<2?"請先新增至少 2 位選手，再按「隨機抽籤產生對戰」。":"按「隨機抽籤產生對戰」建立單淘汰賽。";return;}
  info.textContent=`共 ${players.length} 位選手；賽場編號為「賽場－順序」，長按照片即可晉級或返回上一戰。`;
  bracket.rounds.forEach((round,ri)=>{
    const col=document.createElement("div");col.className="round";
    col.innerHTML=`<h3>${roundName(ri,bracket.rounds.length)}</h3>`;
    const matches=document.createElement("div");matches.className="matches";
    round.forEach((m,mi)=>{
      const box=document.createElement("div");box.className="match";
      const court=document.createElement("div");court.className="court-label";court.textContent=`賽場 ${courtLabel(m)}`;box.appendChild(court);
      [m.p1,m.p2].forEach((id,si)=>{
        const slot=document.createElement("div");
          const eliminated=!!(id&&m.winner&&m.winner!==id);
          slot.className="slot"+(id&&m.winner===id?" winner":"")+(eliminated?" eliminated":"")+(!id?" placeholder":"");
        if(id){
          const p=players.find(x=>x.id===id);
          const b=document.createElement("button");b.className="player-photo";b.type="button";b.title="長按照片 1 秒：晉級／返回上一戰";
          if(p?.photo){const img=document.createElement("img");img.src=p.photo;img.alt=p.name||"選手照片";b.appendChild(img);}
          else {const initials=document.createElement("span");initials.textContent=(p?.name||"選手").slice(0,1);b.appendChild(initials);}
          bindHold(b,()=>chooseWinner(ri,mi,id));
          const name=document.createElement("span");name.className="player-name";name.textContent=p?`${p.registrationNo} ${p.name}`:"選手";
          slot.append(b,name);
        }
        box.appendChild(slot);
      });
      matches.appendChild(box);
    });
    col.appendChild(matches);el.appendChild(col);
  });
  const final=bracket.rounds.at(-1)?.[0]?.winner;
  if(final){
    const c=document.createElement("div");c.className="champion";
    const p=players.find(x=>x.id===final);const photo=document.createElement("div");photo.className="player-photo";
    if(p?.photo){const img=document.createElement("img");img.src=p.photo;img.alt="冠軍照片";photo.appendChild(img);}else{const s=document.createElement("span");s.textContent=(p?.name||"冠軍").slice(0,1);photo.appendChild(s);}
    c.append(photo,document.createTextNode(`冠軍：${playerLabel(final)}`));el.appendChild(c);
  }
}
document.getElementById("drawBtn").onclick=async()=>{
  if(players.length<2){toast("至少需要 2 位選手才能抽籤");return;}
  if(bracket&&!confirm("重新抽籤會覆蓋目前對戰結果，確定嗎？"))return;
  const ids=players.map(p=>p.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const size=2**Math.ceil(Math.log2(ids.length));
  while(ids.length<size)ids.push(null);
  const rounds=[];
  for(let n=size;n>=2;n/=2){
    const matches=[];
    for(let i=0;i<n;i+=2)matches.push({p1:null,p2:null,winner:null,bye:false,resolved:false});
    rounds.push(matches);
  }
  rounds[0].forEach((m,i)=>{
    m.p1=ids[i*2];m.p2=ids[i*2+1];
    m.bye=!!(m.p1&&!m.p2||m.p2&&!m.p1);
    if(m.p1&&!m.p2)m.winner=m.p1;
    if(m.p2&&!m.p1)m.winner=m.p2;
    if(!m.p1&&!m.p2)m.resolved=true;
  });
  bracket={createdAt:new Date().toISOString(),rounds,courtConfig:getCourtConfig()};
  assignCourts();
  rounds[0].forEach((m,i)=>propagateWinner(0,i,m.winner||null));
  await saveBracket();
  toast("隨機對戰表已產生");
};
document.getElementById("courtCount").onchange=async()=>{
  const value=getCourtConfig();
  document.getElementById("courtCount").value=value.count;
  if(bracket){bracket.courtConfig=value;assignCourts();await saveBracket();}
  else renderBracket();
};
document.getElementById("courtStyle").onchange=async()=>{
  const value=getCourtConfig();
  if(bracket){bracket.courtConfig=value;assignCourts();await saveBracket();}
  else renderBracket();
};
document.getElementById("clearBracketBtn").onclick=async()=>{
  if(!bracket)return;
  if(confirm("確定清除目前對戰表？")){bracket=null;await saveBracket();toast("對戰表已清除");}
};
function toast(msg){
  const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1800);
}
window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY)load();});
if(channel)channel.onmessage=e=>{
  if(e.data?.type==="players-updated"){players=e.data.players||[];render();}
  if(e.data?.type==="player-selected"&&e.data.player){
    document.getElementById("selected").textContent=e.data.player.registrationNo;
  }
};
load();
</script>
